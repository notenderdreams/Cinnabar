# Desktop dependency policy. Vulnerability and unsoundness advisories remain errors.
[graph]
targets = [
  "aarch64-apple-darwin", "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Existing unmaintained transitive dependencies of the Tauri/dialog stack.
# Review these exceptions when upgrading Tauri, rfd, and their dependencies.
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "Tauri's Linux GTK 3 bindings require glib 0.18; the fixed glib 0.20 is incompatible. Remove when upstream migrates the GTK stack." },
  { id = "RUSTSEC-2024-0436", reason = "Transitive paste dependency; upstream replacement is tracked by its consumers." },
  { id = "RUSTSEC-2024-0370", reason = "Transitive GTK proc-macro-error dependency; retained for Linux desktop support." },
  { id = "RUSTSEC-2025-0081", reason = "Tauri/wry transitive Unicode dependency; requires an upstream migration." },
  { id = "RUSTSEC-2025-0075", reason = "Tauri/wry transitive Unicode dependency; requires an upstream migration." },
  { id = "RUSTSEC-2025-0080", reason = "Tauri/wry transitive Unicode dependency; requires an upstream migration." },
  { id = "RUSTSEC-2025-0100", reason = "Tauri/wry transitive Unicode dependency; requires an upstream migration." },
  { id = "RUSTSEC-2025-0098", reason = "Tauri/wry transitive Unicode dependency; requires an upstream migration." },
  { id = "RUSTSEC-2026-0371", reason = "rfd/ashpd uses zbus 5; migration to zbus 6 is upstream work." },
  { id = "RUSTSEC-2026-0370", reason = "rfd/ashpd uses zbus 5; migration to zbus 6 is upstream work." },
  { id = "RUSTSEC-2026-0372", reason = "rfd/ashpd uses zbus 5; migration to zbus 6 is upstream work." },
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0",
  "ISC", "MPL-2.0", "Unicode-3.0", "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Tauri and platform adapters require parallel major versions of some crates.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
